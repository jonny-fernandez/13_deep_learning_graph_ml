name: Python Regression & Repository Hygiene
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  python-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install CPU PyTorch and required test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-cp1.txt
      - name: Verify requirements
        run: python -m pip check
      - name: Full offline test suite
        run: python -m pytest -q
      - name: Git hygiene audit
        run: python scripts/cp4_security_audit.py
